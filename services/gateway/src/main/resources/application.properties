quarkus.application.name=gateway
quarkus.http.port=8082

# ---- Live feed ----
skyfeed.gateway.heartbeat-interval=5s
# A client with more than this many messages waiting is disconnected. Waiting messages for the same aircraft or
# sensor replace each other, so this is only reached with that many different aircraft and sensors.
skyfeed.gateway.max-pending-messages=20000
# Protocol-level ping, so a connection whose other end is gone is noticed and closed.
quarkus.websockets-next.server.auto-ping-interval=20s

# ---- Kafka ----
# Dev and prod use the broker of the Compose stack. Tests leave this unset, so Quarkus starts a throwaway broker.
%dev.kafka.bootstrap.servers=localhost:19092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

# Every gateway instance must see every record, so each one reads with a consumer group of its own, starts at
# the newest record (a live feed has no use for old ones) and never commits offsets.
mp.messaging.incoming.adsb-in.connector=smallrye-kafka
mp.messaging.incoming.adsb-in.topic=adsb.state.v1
mp.messaging.incoming.adsb-in.group.id=skyfeed-gateway-${quarkus.uuid}
mp.messaging.incoming.adsb-in.auto.offset.reset=latest
mp.messaging.incoming.adsb-in.enable.auto.commit=false
mp.messaging.incoming.adsb-in.commit-strategy=ignore
mp.messaging.incoming.adsb-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.telemetry-in.connector=smallrye-kafka
mp.messaging.incoming.telemetry-in.topic=telemetry.v1
mp.messaging.incoming.telemetry-in.group.id=skyfeed-gateway-${quarkus.uuid}
mp.messaging.incoming.telemetry-in.auto.offset.reset=latest
mp.messaging.incoming.telemetry-in.enable.auto.commit=false
mp.messaging.incoming.telemetry-in.commit-strategy=ignore
mp.messaging.incoming.telemetry-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Tests take any free port, so they also run while the Compose stack is up.
%test.quarkus.http.test-port=0
