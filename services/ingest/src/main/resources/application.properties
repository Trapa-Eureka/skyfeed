quarkus.application.name=ingest
quarkus.http.port=8081

# ---- ADS-B source ----
# replay: the local replay server (recorded data, the default). opensky: the live API, limited by the credit budget.
skyfeed.adsb.source=replay
skyfeed.adsb.poll-interval=10s
skyfeed.adsb.replay.url=http://localhost:18090
skyfeed.adsb.opensky.url=https://opensky-network.org
# Credits the service may spend per UTC day in opensky mode. Anonymous access had 400 a day when this was written.
skyfeed.adsb.opensky.daily-credit-budget=300
# Map area: the central Philippines, 25 square degrees (one credit per request).
skyfeed.adsb.area.lamin=10
skyfeed.adsb.area.lomin=119.5
skyfeed.adsb.area.lamax=15
skyfeed.adsb.area.lomax=124.5

# ---- Kafka ----
# Dev and prod use the broker of the Compose stack. Tests leave this unset, so Quarkus starts a throwaway broker.
%dev.kafka.bootstrap.servers=localhost:19092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

mp.messaging.outgoing.telemetry-out.connector=smallrye-kafka
mp.messaging.outgoing.telemetry-out.topic=telemetry.v1
mp.messaging.outgoing.telemetry-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.telemetry-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.telemetry-dlq.connector=smallrye-kafka
mp.messaging.outgoing.telemetry-dlq.topic=telemetry.dlq.v1
mp.messaging.outgoing.telemetry-dlq.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.telemetry-dlq.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

mp.messaging.outgoing.adsb-out.connector=smallrye-kafka
mp.messaging.outgoing.adsb-out.topic=adsb.state.v1
mp.messaging.outgoing.adsb-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.adsb-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- MQTT ----
mp.messaging.incoming.telemetry-mqtt.connector=smallrye-mqtt
mp.messaging.incoming.telemetry-mqtt.host=localhost
mp.messaging.incoming.telemetry-mqtt.port=11883
mp.messaging.incoming.telemetry-mqtt.topic=sensors/+/telemetry
mp.messaging.incoming.telemetry-mqtt.qos=1
mp.messaging.incoming.telemetry-mqtt.client-id=skyfeed-ingest
# A reading that could not be written to Kafka is logged and counted; the bridge keeps running.
mp.messaging.incoming.telemetry-mqtt.failure-strategy=ignore

# Tests take any free port, so they also run while the Compose stack is up.
%test.quarkus.http.test-port=0
