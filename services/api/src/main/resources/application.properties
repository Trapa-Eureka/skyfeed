spring.application.name=api
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:15432}/skyfeed
spring.datasource.username=skyfeed
spring.datasource.password=${POSTGRES_PASSWORD:skyfeed}
# The schema is changed only by the Flyway migrations in db/migration. Hibernate checks that its entities fit and never alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- Kafka ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.group-id=skyfeed-api
spring.kafka.consumer.auto-offset-reset=earliest

# ---- HTTP ----
# Errors are answered as RFC 9457 problem details.
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,metrics,prometheus
# The health answer names its parts (database, disk), so a failed dependency can be told from a failed service.
management.endpoint.health.show-details=always

# ---- SkyFeed ----
# A sensor is online while its latest reading is younger than degraded-after, degraded until offline-after, then offline.
skyfeed.sensor.degraded-after=10s
skyfeed.sensor.offline-after=30s
# How often the status of every sensor is checked for a change.
skyfeed.sensor.check-interval=2s
# How often events waiting in the outbox are sent to Kafka.
skyfeed.outbox.poll-interval=500ms
# An aircraft counts as current while its last contact is younger than this.
skyfeed.aircraft.current-within=60s
